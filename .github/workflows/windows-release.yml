name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
        shell: pwsh

      - name: Prepare build metadata (config.json)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $repo = $env:GITHUB_REPOSITORY
          $path = "config.json"
          $meta = Get-Content -Path $path -Raw -Encoding UTF8 | ConvertFrom-Json
          $meta.version = $version
          $meta.github_repo = $repo
          ($meta | ConvertTo-Json -Compress -Depth 10) | Set-Content -Path $path -Encoding UTF8

      - name: Build PyInstaller (main app + ota-updater)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist, build -ErrorAction SilentlyContinue
          pyinstaller build.spec

      - name: Create OTA ZIP (exclude ota-updater.exe)
        id: ota_zip
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $zipName = "NiziPOSConnector-win-ota-$version.zip"

          $staging = Join-Path $env:RUNNER_TEMP "nizi_pos_connector_ota_staging"
          Remove-Item -Recurse -Force $staging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          Copy-Item -Path "dist\NiziPOSConnector\*" -Destination $staging -Recurse -Force
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $staging "ota-updater.exe")

          # Zip contents at the zip root (main .exe, static/, assets/, ...)
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $zipName -Force

          $zipPath = (Resolve-Path $zipName).Path
          $sha = (Get-FileHash -Algorithm SHA256 $zipPath).Hash

          $manifest = @{
            version = $version
            sha256 = $sha
            zip_asset_name = $zipName
          }
          $manifest | ConvertTo-Json -Depth 5 -Compress | Set-Content "manifest-win.json" -Encoding UTF8

          Write-Output "zipName=$zipName"
          Write-Output "zipPath=$zipPath"
          Write-Output "sha256=$sha"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
  
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          # Install Inno Setup
          choco install innosetup -y --no-progress

          $isccPath = "iscc"
          $defaultIscc = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          if (Test-Path $defaultIscc) {
            $isccPath = $defaultIscc
          }

          if ($isccPath -eq "iscc" -and -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            Write-Error "Inno Setup compiler (iscc) not found."
            exit 1
          }

          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $arch = "x64"
          & $isccPath "/DAppVer=$version" "/DAppArch=$arch" "win_setup.iss"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup installer compilation failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create release if it doesn't exist
          gh release view ${{ github.ref_name }} || gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --notes "Release ${{ github.ref_name }}"
          # Upload assets
          gh release upload ${{ github.ref_name }} manifest-win.json NiziPOSConnector-win-ota-*.zip dist/NiziPOSConnector-Installer-*.exe --clobber

