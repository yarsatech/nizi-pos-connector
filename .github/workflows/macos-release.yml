name: macOS Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare build metadata (config.json)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          export VERSION="${TAG#v}"
          echo "APP_VERSION_STRIPPED=$VERSION" >> "$GITHUB_ENV"

          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path("config.json")
          meta = json.loads(path.read_text(encoding="utf-8"))
          meta["version"]     = os.environ["VERSION"]
          meta["github_repo"] = os.environ["REPO"]
          path.write_text(
              json.dumps(meta, separators=(",", ":"), ensure_ascii=False),
              encoding="utf-8",
          )
          PY

      - name: Generate macOS ICNS icon
        shell: bash
        run: |
          python create_icns.py

      - name: Build macOS Installer (.pkg)
        shell: bash
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh dist "${APP_VERSION_STRIPPED}"

      - name: Create OTA ZIP (exclude ota-updater)
        id: ota_zip
        shell: bash
        run: |
          VERSION="${APP_VERSION_STRIPPED}"
          ZIP_NAME="NiziPOSConnector-macos-ota-${VERSION}.zip"
          STAGING="${RUNNER_TEMP}/nizi_pos_ota_staging"

          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          # Copy .app bundle contents (Contents/MacOS) for in-place OTA replacement
          cp -R dist/NiziPOSConnector.app/Contents/MacOS/* "$STAGING"/
          rm -f "$STAGING/ota-updater"

          export VERSION ZIP_NAME STAGING

          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path

          staging  = Path(os.environ["STAGING"])
          zip_name = os.environ["ZIP_NAME"]
          version  = os.environ["VERSION"]

          with zipfile.ZipFile(zip_name, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for p in staging.rglob("*"):
                  if p.is_dir():
                      continue
                  zf.write(p, p.relative_to(staging).as_posix())

          data = Path(zip_name).read_bytes()
          sha  = hashlib.sha256(data).hexdigest()

          manifest = {
              "version":        version,
              "sha256":         sha,
              "zip_asset_name": zip_name,
          }
          Path("manifest-macos.json").write_text(
              json.dumps(manifest, separators=(",", ":"), ensure_ascii=False),
              encoding="utf-8",
          )

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              f.write(f"zipName={zip_name}\n")
              f.write(f"zipPath={Path(zip_name).resolve()}\n")
              f.write(f"sha256={sha}\n")
          PY

      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${APP_VERSION_STRIPPED}"

          NOTES=$(cat <<EOF
          ## Nizi POS Connector ${TAG}

          ### Assets
          - \`NiziPOSConnector-Installer-${VERSION}-macOS.pkg\` — macOS package installer
          - \`NiziPOSConnector-macos-ota-${VERSION}.zip\` — OTA update bundle (used by the app's auto-updater)
          - \`manifest-macos.json\` — OTA manifest (SHA-256 + asset name)
          EOF
          )

          # Create release if it does not exist yet (concurrent jobs safe)
          gh release view "$TAG" 2>/dev/null || \
            gh release create "$TAG" --title "Nizi POS Connector $TAG" --notes "$NOTES"

          # Upload macOS assets
          gh release upload "$TAG" \
            manifest-macos.json \
            "NiziPOSConnector-macos-ota-${VERSION}.zip" \
            dist/*.pkg \
            --clobber
